name: mashallah_crockery_billing
description: "A professional offline-first Android billing and sales record app for Mashallah Crockery."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local SQLite Database (Offline-first)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Identifiers & Formatting
  uuid: ^4.4.0
  intl: ^0.19.0

  # Supabase Cloud Database & Auth (Multi-phone sync)
  supabase_flutter: ^2.5.6

  # Network connectivity detection
  connectivity_plus: ^6.0.3

  # Bluetooth Thermal Printing (ESC/POS)
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4

  # State Management & Preferences
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Icons & UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
